name: Deploy payment-api

# Release pipeline for the sample service, reporting every stage to NexOps.
#   push to main            -> build, test, scan, push v<VERSION file>, deploy, report
#   workflow_dispatch       -> manual release, or rollback=true to redeploy an existing image tag
# NexOps dispatches this workflow (rollback=true) when an approved rollback uses the github_actions strategy.
#
# Repository variables: AWS_REGION, AWS_ROLE_ARN, EC2_INSTANCE_ID, NEXOPS_URL, DEPLOY_TARGET (ec2|eks),
#                       EKS_CLUSTER_NAME (eks only, default nexops-eks), DEMO_TRAFFIC ("true" to run the traffic generator)
# DEPLOY_TARGET=eks: the Argo Rollout runs a canary that NexOps (in the cluster) analyses; this job reports to that
# NexOps through `kubectl port-forward`, so the cluster needs no public webhook endpoint.
# Repository secret:    NEXOPS_WEBHOOK_SECRET

on:
  push:
    branches: [main]
    paths:
      - examples/payment-api/**
      - examples/traffic-generator/**
  workflow_dispatch:
    inputs:
      version:
        description: "Version / image tag (e.g. v1.4.2). Defaults to examples/payment-api/VERSION."
        required: false
      rollback:
        description: "Redeploy an existing image without building"
        type: choice
        options: ["false", "true"]
        default: "false"
      environment:
        description: "Target environment"
        required: false
        default: production
      reason:
        description: "Why (recorded in NexOps)"
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-payment-api
  cancel-in-progress: false

env:
  APP: payment-api
  AWS_REGION: ${{ vars.AWS_REGION }}
  PROJECT: ${{ vars.NEXOPS_PROJECT || 'nexops' }}
  NEXOPS_URL: ${{ vars.NEXOPS_URL }}
  NEXOPS_WEBHOOK_SECRET: ${{ secrets.NEXOPS_WEBHOOK_SECRET }}
  NEXOPS_BASE_SHA: ${{ github.event.before }}

jobs:
  deploy:
    # hosted.py down sets HOSTED_UP=false (nothing in AWS to deploy to); up sets it back to true.
    if: vars.HOSTED_UP != 'false'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          VERSION="${{ inputs.version }}"
          [ -n "$VERSION" ] || VERSION="v$(tr -d '[:space:]' < examples/payment-api/VERSION)"
          KIND=release
          [ "${{ inputs.rollback }}" = "true" ] && KIND=rollback
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          echo "Deploying $APP $VERSION ($KIND)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Connect to NexOps on EKS
        if: vars.DEPLOY_TARGET == 'eks'
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME || 'nexops-eks' }}"
          nohup kubectl -n nexops port-forward svc/nexops-api 18000:8000 > /tmp/port-forward.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:18000/ready > /dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:18000/ready
          echo "NEXOPS_URL=http://127.0.0.1:18000" >> "$GITHUB_ENV"

      - name: Report deployment start to NexOps
        continue-on-error: true
        run: python3 scripts/nexops_notify.py deployment --event started --application "$APP" --version "${{ steps.meta.outputs.version }}" --kind "${{ steps.meta.outputs.kind }}" --stage Build=in_progress

      - name: NexOps deploy gate
        if: steps.meta.outputs.kind == 'release'
        run: python3 scripts/nexops_notify.py gate --application "$APP" --kind release

      - uses: actions/setup-python@v5
        if: steps.meta.outputs.kind == 'release'
        with:
          python-version: "3.12"

      - name: Tests
        id: tests
        if: steps.meta.outputs.kind == 'release'
        working-directory: examples/payment-api
        run: |
          pip install -r requirements.txt
          python -c "import app.main; print('import ok')"
          python -c "import json; c = json.load(open('config/database.json')); assert isinstance(c['port'], int) and c['host']; print('config ok')"

      - name: Dependency security scan
        id: security
        if: steps.meta.outputs.kind == 'release'
        working-directory: examples/payment-api
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: docker/setup-buildx-action@v3
        if: steps.meta.outputs.kind == 'release'

      - name: Build and push image
        id: build
        if: steps.meta.outputs.kind == 'release'
        uses: docker/build-push-action@v6
        with:
          context: examples/payment-api
          push: true
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/payment-api:${{ steps.meta.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/payment-api:sha-${{ github.sha }}

      - name: Build and push traffic generator
        if: steps.meta.outputs.kind == 'release' && vars.DEMO_TRAFFIC == 'true'
        uses: docker/build-push-action@v6
        with:
          context: examples/traffic-generator
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/traffic-generator:latest

      - name: Confirm rollback image exists
        if: steps.meta.outputs.kind == 'rollback'
        run: aws ecr describe-images --repository-name payment-api --image-ids imageTag="${{ steps.meta.outputs.version }}" > /dev/null

      - name: Deploy to EKS (Argo Rollouts canary, NexOps analysis)
        id: deploy_eks
        if: vars.DEPLOY_TARGET == 'eks'
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/payment-api:${{ steps.meta.outputs.version }}"
          kubectl -n payments patch rollout payment-api --type json \
            -p "[{\"op\":\"replace\",\"path\":\"/spec/template/spec/containers/0/image\",\"value\":\"${IMAGE}\"}]"
          GENERATION=$(kubectl -n payments get rollout payment-api -o jsonpath='{.metadata.generation}')
          for i in $(seq 1 180); do
            # "|" separated: an unset field (e.g. abort) stays empty instead of shifting the others.
            IFS='|' read -r OBSERVED PHASE ABORT STABLE CURRENT STEP <<< "$(kubectl -n payments get rollout payment-api \
              -o jsonpath='{.status.observedGeneration}|{.status.phase}|{.status.abort}|{.status.stableRS}|{.status.currentPodHash}|{.status.currentStepIndex}')"
            echo "rollout: phase=${PHASE} step=${STEP} abort=${ABORT:-false}"
            if [ "$ABORT" = "true" ] || [ "$PHASE" = "Degraded" ]; then
              kubectl -n payments get analysisrun -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,MESSAGE:.status.message || true
              echo "canary=aborted" >> "$GITHUB_OUTPUT"; exit 1
            fi
            if [ "$OBSERVED" = "$GENERATION" ] && [ "$PHASE" = "Healthy" ] && [ "$STABLE" = "$CURRENT" ]; then
              echo "canary=promoted" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 5
          done
          echo "Rollout did not finish in 15 minutes"; exit 1

      - name: Deploy to EC2 through SSM
        id: deploy_ec2
        if: vars.DEPLOY_TARGET != 'eks'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          SERVICES="payment-api:${VERSION}"
          [ "${{ vars.DEMO_TRAFFIC }}" = "true" ] && SERVICES="$SERVICES traffic-generator:latest"
          for item in $SERVICES; do
            SERVICE="${item%%:*}"; TAG="${item#*:}"
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
              --document-name AWS-RunShellScript \
              --comment "$SERVICE $TAG" \
              --parameters "commands=[\"bash /opt/nexops/aws/deploy-app.sh ${PROJECT} ${AWS_REGION} ${REGISTRY} ${SERVICE} ${TAG}\"]" \
              --query Command.CommandId --output text)
            aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true
            aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' --output json
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text)
            test "$STATUS" = "Success"
          done

      - name: Report deployment result to NexOps
        if: always()
        continue-on-error: true
        run: |
          DEPLOY="${{ steps.deploy_ec2.outcome }}"
          CI_STATUS="${{ job.status }}"
          SUMMARY="${{ inputs.reason }}"
          if [ "${{ vars.DEPLOY_TARGET }}" = "eks" ]; then
            DEPLOY="${{ steps.deploy_eks.outcome }}"
            if [ "${{ steps.deploy_eks.outputs.canary }}" = "aborted" ]; then
              CI_STATUS=aborted
              SUMMARY="Canary aborted by Argo Rollouts after NexOps analysis failed; the stable version kept serving."
            fi
          fi
          python3 scripts/nexops_notify.py deployment --event finished \
            --application "$APP" --version "${{ steps.meta.outputs.version }}" --kind "${{ steps.meta.outputs.kind }}" \
            --environment "${{ inputs.environment || 'production' }}" \
            --image "${{ steps.ecr.outputs.registry }}/payment-api:${{ steps.meta.outputs.version }}" \
            --ci-status "$CI_STATUS" \
            --summary "$SUMMARY" \
            --path examples/payment-api \
            --stage "Tests=${{ steps.tests.outcome }}" \
            --stage "Security=${{ steps.security.outcome }}" \
            --stage "Build=${{ steps.build.outcome }}" \
            --stage "Deploy=${DEPLOY}"
