name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  migrations:
    name: Migrations on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexops
          POSTGRES_PASSWORD: nexops
          POSTGRES_DB: nexops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexops -d nexops"
          --health-interval 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nexops:nexops@localhost:5432/nexops
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt
      - name: Upgrade, check for model drift, downgrade
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build

  sample-app:
    name: Sample service checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: examples/payment-api
        run: |
          pip install -r requirements.txt pip-audit
          python -c "import app.main"
          pip-audit -r requirements.txt

  images:
    name: Container builds
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: examples/payment-api
          push: false

  infrastructure:
    name: Terraform and Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - name: Validate stacks
        run: |
          for stack in infra/terraform/aws infra/terraform/eks; do
            terraform -chdir=$stack init -backend=false -input=false
            terraform -chdir=$stack validate
          done
      - name: Render kustomizations
        run: |
          for dir in nexops observability payments overlays/kind overlays/eks; do
            kubectl kustomize "deploy/k8s/$dir" > /dev/null && echo "deploy/k8s/$dir ok"
          done
