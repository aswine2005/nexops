apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app: jaeger }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: query, port: 16686, targetPort: 16686 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.5.0
          args: ["--config", "/etc/jaeger/jaeger.yaml"]
          ports: [{ containerPort: 4318 }, { containerPort: 4317 }, { containerPort: 16686 }]
          readinessProbe:
            tcpSocket: { port: 16686 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts: [{ name: config, mountPath: /etc/jaeger }]
      volumes:
        - name: config
          configMap: { name: jaeger-config }
