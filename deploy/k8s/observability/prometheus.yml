global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Pods opt in with prometheus.io/scrape, prometheus.io/port and prometheus.io/path annotations.
  - job_name: kubernetes-pods
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Pending|Succeeded|Failed
        action: drop
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        regex: (.+)
        target_label: __metrics_path__
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: app
      # Argo Rollouts labels every pod with its ReplicaSet hash: canary vs stable in PromQL.
      - source_labels: [__meta_kubernetes_pod_label_rollouts_pod_template_hash]
        target_label: rollouts_pod_template_hash
