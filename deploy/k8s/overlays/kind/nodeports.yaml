apiVersion: v1
kind: Service
metadata:
  name: nexops-web
  namespace: nexops
spec:
  type: NodePort
  ports: [{ name: http, port: 80, targetPort: 8080, nodePort: 30080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  type: NodePort
  ports: [{ name: query, port: 16686, targetPort: 16686, nodePort: 30686 }]
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
spec:
  type: NodePort
  ports: [{ name: http, port: 9090, targetPort: 9090, nodePort: 30090 }]
