apiVersion: v1
kind: Service
metadata:
  name: nexops-web
spec:
  selector: { app: nexops-web }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexops-web
spec:
  replicas: 1
  selector:
    matchLabels: { app: nexops-web }
  template:
    metadata:
      labels: { app: nexops-web }
    spec:
      containers:
        - name: web
          image: nexops-web
          env:
            - { name: NEXOPS_API_UPSTREAM, value: "nexops-api.nexops.svc.cluster.local:8000" }
            - { name: NGINX_RESOLVER, value: "kube-dns.kube-system.svc.cluster.local" }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
